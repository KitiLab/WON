name: Repository Foundation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-documentation:
    name: Documentation Integrity & Governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Core Governance Files
        run: |
          for file in README.md LICENSE_PENDING.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md GOVERNANCE.md AGENTS.md; do
            if [ ! -f "$file" ]; then
              echo "Error: Required file $file is missing"
              exit 1
            fi
          done
          echo "All core governance files verified."

      - name: Verify Architecture Documentation
        run: |
          for doc in \
            docs/vision.md \
            docs/roadmap.md \
            docs/language-design.md \
            docs/compiler-architecture.md \
            docs/performance-principles.md \
            docs/memory-model.md \
            docs/interoperability.md \
            docs/ai-native-design.md \
            docs/security-model.md \
            docs/benchmarking.md \
            docs/phase-0-proof-of-concept.md \
            docs/compiler/phase-2a-typed-semantic-model.md \
            docs/compiler/phase-2a-semantic-analysis.md \
            docs/compiler/phase-2a.1-correctness-hardening.md \
            docs/decisions/ADR-000-template.md \
            docs/decisions/ADR-001-c-codegen-backend.md \
            docs/decisions/ADR-002-compiler-implementation-language.md \
            docs/decisions/ADR-003-ownership-lite-memory-model.md \
            docs/decisions/ADR-004-ai-independent-compiler-query-interface.md \
            docs/decisions/ADR-005-public-benchmark-methodology.md \
            docs/decisions/ADR-006-c-header-parsing-strategy.md \
            docs/decisions/ADR-007-formal-syntax-and-indentation-grammar.md \
            docs/decisions/ADR-008-structured-concurrency-and-zero-gil.md \
            docs/decisions/ADR-009-typed-intermediate-representation-architecture.md \
            docs/decisions/ADR-010-compiler-self-hosting-bootstrap-pipeline.md \
            docs/decisions/OWNER-APPROVAL-2026-11-24.md; do
            if [ ! -f "$doc" ]; then
              echo "Error: Required documentation $doc is missing"
              exit 1
            fi
          done
          echo "All architectural documents verified."

      - name: Verify Specification Files
        run: |
          for spec in \
            docs/language-spec/README.md \
            docs/language-spec/syntax-and-grammar.md \
            docs/language-spec/type-system.md \
            docs/language-spec/ownership-and-memory.md \
            docs/language-spec/concurrency-model.md \
            docs/language-spec/error-handling.md \
            docs/language-spec/c-interop-and-unsafe.md \
            docs/language-spec/modules-and-visibility.md \
            docs/language-spec/performance-and-execution.md \
            docs/language-spec/self-hosting-and-bootstrap.md \
            docs/language-spec/compiler-and-ir-requirements.md \
            docs/language-spec/safety-and-security-semantics.md \
            docs/language-spec/versioning-and-compatibility.md \
            docs/language-spec/reconciliation-and-glossary.md \
            docs/language-spec/phase-1a.1-semantic-closure.md; do
            if [ ! -f "$spec" ]; then
              echo "Error: Required specification file $spec is missing"
              exit 1
            fi
          done
          echo "All language specification files verified."

      - name: Run Link Checker Unit Tests
        run: |
          python3 -m unittest tests/test_check_markdown_links.py

      - name: Verify Relative Markdown Links
        run: |
          python3 tools/check_markdown_links.py --root .

  test-compiler:
    name: Bootstrap Compiler Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go Formatting
        run: |
          cd compiler/poc
          diff -u <(echo -n) <(gofmt -d .)

      - name: Run Go Vet
        run: |
          cd compiler/poc
          go vet ./...

      - name: Run Go Unit & Integration Tests
        run: |
          cd compiler/poc
          go test -v ./...

      - name: Verify Canonical Frontend CLI Parse and Check
        run: |
          cd compiler/poc
          go run ./cmd/wonc parse ../../examples/zlib_compression.won
          go run ./cmd/wonc parse ../../tests/language-spec/valid/types/struct_and_enum.won
          go run ./cmd/wonc check ../../examples/zlib_compression.won
          go run ./cmd/wonc check ../../tests/language-spec/valid/types/struct_and_enum.won
          go run ./cmd/wonc check ../../tests/language-spec/valid/types/full_width_integers.won
          go run ./cmd/wonc check ../../tests/language-spec/valid/enums/option_result_try.won
